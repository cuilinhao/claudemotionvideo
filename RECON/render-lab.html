<!doctype html><html><head><meta charset="utf-8"><title>Animation export verification</title><style>body{font:16px system-ui;background:#111;color:white;padding:30px}iframe{width:960px;height:540px;max-width:90vw;border:1px solid #444}button,input{padding:12px;margin:10px}#status{padding:12px;color:#8f8}</style></head><body><h1>ORBIT · Live APIMart output</h1><p id="status">Loading</p><iframe id="preview" sandbox="allow-scripts"></iframe><br><button id="play">Play</button><input id="seek" type="range" min="0" max="10" step="0.05" value="0"><button id="export">Export MP4</button><a id="download" hidden>Download verified MP4</a><script type="module">
import{buildPreviewDocument,exportMp4}from'/src/lib/renderer.ts';
const channel=crypto.randomUUID();const frame=document.getElementById('preview');const status=document.getElementById('status');
const data=await(await fetch('/RECON/live-generation.json')).json();const asset=await(await fetch('/RECON/test-product.png')).blob();const assetUrl=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(asset)});
window.addEventListener('message',e=>{if(e.source!==frame.contentWindow||e.data?.channel!==channel)return;if(e.data.type==='cmv:ready')status.textContent='Ready: '+e.data.width+' × '+e.data.height+' · '+e.data.duration+' sec';if(e.data.type==='cmv:error')status.textContent='ERROR: '+e.data.error});frame.srcdoc=buildPreviewDocument(data.html,{'test-orbit':assetUrl},channel);
let play=false,t=0;document.getElementById('play').onclick=()=>{play=!play;document.getElementById('play').textContent=play?'Pause':'Play'};setInterval(()=>{if(!play)return;t=(t+.05)%10;frame.contentWindow.postMessage({type:'cmv:seek',time:t,channel},'*')},50);document.getElementById('seek').oninput=e=>{play=false;t=+e.target.value;frame.contentWindow.postMessage({type:'cmv:seek',time:t,channel},'*')};
document.getElementById('export').onclick=async()=>{play=false;status.textContent='Export started';try{const blob=await exportMp4(frame,{channel,duration:10,aspect:'16:9',onProgress:p=>status.textContent='Export '+Math.round(p*100)+'%'});const a=document.getElementById('download');a.href=URL.createObjectURL(blob);a.download='orbit-verified.mp4';a.hidden=false;status.textContent='MP4 ready · '+blob.size+' bytes';}catch(e){status.textContent='EXPORT ERROR: '+e.message}};
</script></body></html>
